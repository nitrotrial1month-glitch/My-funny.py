<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | inwear</title>
    <style>
        :root { --primary-red: #cc0000; --bg-color: #f1f2f4; --white: #ffffff; --text-dark: #212121; }
        body { background-color: var(--bg-color); font-family: sans-serif; margin: 0; padding-bottom: 100px; }
        
        .header { background: var(--white); padding: 15px; font-weight: bold; font-size: 18px; border-bottom: 1px solid #ddd; position: sticky; top: 0; }
        .cart-item { background: var(--white); padding: 15px; display: flex; gap: 15px; margin-bottom: 10px; border-bottom: 1px solid #eee; }
        .item-img { width: 80px; height: 100px; background: #f0f0f0; object-fit: cover; }
        .item-details { flex: 1; }
        .item-name { font-weight: bold; margin-bottom: 5px; }
        .item-price { color: var(--primary-red); font-weight: bold; }
        .remove-btn { color: #888; font-size: 13px; cursor: pointer; text-decoration: underline; margin-top: 5px; display: inline-block; }
        
        .footer-bar { position: fixed; bottom: 0; width: 100%; background: var(--white); padding: 15px; border-top: 2px solid #eee; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .total-price { font-size: 18px; font-weight: bold; }
        .place-order-btn { background: var(--primary-red); color: white; padding: 12px 25px; border-radius: 5px; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">My Cart</div>
    
    <div id="cart-items">
        {% if cart_items %}
            {% for item in cart_items %}
            <div class="cart-item">
                <img src="{{ item.image }}" class="item-img" alt="Product">
                <div class="item-details">
                    <div class="item-name">{{ item.name }}</div>
                    <div class="item-price">₹{{ item.price }}</div>
                    <a href="/remove_from_cart/{{ item.id }}" class="remove-btn">Remove</a>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div style="text-align: center; margin-top: 50px;">Your cart is empty!</div>
        {% endif %}
    </div>

    <div class="footer-bar">
        <div class="total-price">Total: ₹{{ total_price }}</div>
        <a href="/checkout" class="place-order-btn">Place Order</a>
    </div>
</body>
</html>
