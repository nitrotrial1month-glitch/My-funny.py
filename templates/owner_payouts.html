<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payouts - inwear</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { text-decoration: none; color: #cc0000; font-weight: bold; font-size: 14px; }
        .revenue-card { background: linear-gradient(135deg, #00a650 0%, #007b3b 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,166,80,0.2); }
        .revenue-card h3 { margin: 0; font-size: 14px; opacity: 0.9; }
        .revenue-card h1 { margin: 10px 0 0; font-size: 32px; }
        .payout-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #ff9900; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .payout-info h4 { margin: 0; font-size: 16px; color: #212121; }
        .payout-info p { margin: 4px 0 0; font-size: 12px; color: #666; font-weight: bold; }
        .pay-btn { background: #212121; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h2>💸 Payouts</h2>
        <a href="/owner-dashboard" class="back-btn">‹ Back to Panel</a>
    </div>

    <div class="revenue-card">
        <h3>Total Platform Revenue (10% Cut)</h3>
        <h1>₹{{ "%.2f"|format(platform_revenue) }}</h1>
    </div>

    <h3 style="font-size: 14px; color: #666; text-transform: uppercase;">Pending Requests</h3>

    {% if payouts %}
        {% for p in payouts %}
        <div class="payout-card">
            <div class="payout-info">
                <h4>{{ p.seller_name }}</h4>
                <p style="color: #cc0000;">Amount: ₹{{ p.amount }}</p>
                <p>UPI ID: {{ p.upi_id }}</p>
            </div>
            <form action="/owner/approve-payout/{{ p._id }}" method="POST">
                <button type="submit" class="pay-btn" onclick="return confirm('Confirm payment sent to UPI?')">Mark Paid</button>
            </form>
        </div>
        {% endfor %}
    {% else %}
        <p style="text-align: center; color: #888; background: white; padding: 20px; border-radius: 10px;">No pending payout requests!</p>
    {% endif %}
</body>
</html>
