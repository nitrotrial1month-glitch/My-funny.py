<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Premium Product | inwear</title>
    <style>
        :root { --primary: #cc0000; --dark: #1a1a2e; --success: #00a650; --blue: #2874f0; --bg: #f4f6f8; --white: #ffffff; --border: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 40px; color: #212121; }
        .header { background: var(--dark); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 100; }
        .back-btn { color: white; text-decoration: none; font-size: 20px; font-weight: bold; }
        .header h3 { margin: 0; font-size: 16px; text-transform: uppercase; }
        .container { padding: 15px; }
        .form-section { background: var(--white); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid var(--border); }
        .section-title { font-size: 13px; font-weight: 900; color: var(--primary); text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; box-sizing: border-box; outline: none; background: #fafafa; }
        textarea.form-control { resize: vertical; min-height: 70px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .upload-box { border: 2px dashed #ccc; border-radius: 8px; padding: 20px 10px; text-align: center; background: #fafafa; position: relative; cursor: pointer; }
        .upload-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .preview-container { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .preview-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; }
        .preview-vid { width: 100%; max-height: 150px; border-radius: 6px; display: none; margin-top: 10px; }
        .size-container { display: flex; gap: 10px; flex-wrap: wrap; }
        .size-box { position: relative; }
        .size-box input { display: none; }
        .size-label { display: block; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; background: #fafafa; }
        .size-box input:checked + .size-label { background: var(--dark); color: white; border-color: var(--dark); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--blue); }
        input:checked + .slider:before { transform: translateX(20px); }
        .btn-submit { display: block; width: 100%; background: var(--success); color: white; padding: 16px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/seller-dashboard" class="back-btn">←</a>
        <h3>Publish New Product</h3>
    </div>
    
    <div class="container">
        <form action="/add-product" method="POST" enctype="multipart/form-data">
            
            <div class="form-section">
                <div class="section-title">📸 Media Upload</div>
                <div class="form-group">
                    <label>Photos (Select up to 3 images)</label>
                    <div class="upload-box">
                        <span style="font-size: 24px;">🖼️</span>
                        <p style="margin: 5px 0 0; font-size: 12px; color: #666;">Tap to select photos</p>
                        <input type="file" name="product_images" id="img-input" accept="image/*" multiple required>
                    </div>
                    <div class="preview-container" id="img-preview"></div>
                </div>
                <div class="form-group">
                    <label>Product Video (Optional - Max 30 sec)</label>
                    <div class="upload-box" style="padding: 15px 10px;">
                        <span style="font-size: 20px;">🎥</span>
                        <p style="margin: 5px 0 0; font-size: 12px; color: #666;">Tap to select a video</p>
                        <input type="file" name="product_video" id="vid-input" accept="video/mp4,video/x-m4v,video/*">
                    </div>
                    <video id="vid-preview" class="preview-vid" controls></video>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">📝 Basic Information</div>
                <div class="form-group">
                    <label>Product Title</label>
                    <input type="text" name="product_name" class="form-control" placeholder="e.g. Black Oversized Anime T-Shirt" required>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>Selling Price (₹)</label><input type="number" name="product_price" class="form-control" required min="1"></div>
                    <div class="form-group"><label>Original MRP (₹)</label><input type="number" name="product_mrp" class="form-control" required></div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Category</label>
                        <select name="product_category" class="form-control" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="Men">Men's Wear</option><option value="Women">Women's Wear</option>
                            <option value="Anime">Anime Merch</option><option value="Oversized">Oversized Fits</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Total Stock</label><input type="number" name="product_stock" class="form-control" required min="1"></div>
                </div>
                <div class="form-group">
                    <label>Available Sizes</label>
                    <div class="size-container">
                        <label class="size-box"><input type="checkbox" name="sizes" value="S"><span class="size-label">S</span></label>
                        <label class="size-box"><input type="checkbox" name="sizes" value="M"><span class="size-label">M</span></label>
                        <label class="size-box"><input type="checkbox" name="sizes" value="L"><span class="size-label">L</span></label>
                        <label class="size-box"><input type="checkbox" name="sizes" value="XL"><span class="size-label">XL</span></label>
                        <label class="size-box"><input type="checkbox" name="sizes" value="XXL"><span class="size-label">XXL</span></label>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">🔍 Details & Policies</div>
                <div class="form-group"><label>Product Details (Short Specs)</label><textarea name="product_details" class="form-control" placeholder="e.g. Fabric: Cotton | Fit: Oversized" required></textarea></div>
                <div class="form-group"><label>Full Description</label><textarea name="product_description" class="form-control" placeholder="Detailed info about the product..." required></textarea></div>
                <div class="form-group"><label>Search Tags (Comma separated)</label><input type="text" name="product_tags" class="form-control" placeholder="anime, gojo, tshirt" required></div>
                <div class="form-group">
                    <label>Return & Replace Policy</label>
                    <select name="return_policy" class="form-control" required>
                        <option value="7 Days Refund & Replace">7 Days Refund & Replace</option>
                        <option value="7 Days Replacement Only">7 Days Replacement Only</option>
                        <option value="Non-Returnable">Non-Returnable</option>
                    </select>
                </div>
            </div>

            <div class="form-section" style="background: #f0f7ff; border: 1px dashed var(--blue); display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 style="margin: 0; color: var(--blue); font-size: 14px;">🏅 Apply for inwear Insure</h4>
                    <p style="margin: 0; font-size: 11px; color: #555;">Get verified badge from Owner.</p>
                </div>
                <label class="switch"><input type="checkbox" name="apply_insure" value="Pending Approval"><span class="slider"></span></label>
            </div>

            <button type="submit" class="btn-submit">✅ Publish Product</button>
        </form>
    </div>

    <script>
        const imgInput = document.getElementById('img-input');
        const imgPreview = document.getElementById('img-preview');
        imgInput.addEventListener('change', function() {
            imgPreview.innerHTML = ''; 
            let files = Array.from(this.files);
            if (files.length > 3) { alert("Max 3 photos allowed."); files = files.slice(0, 3); }
            files.forEach(file => {
                let reader = new FileReader();
                reader.onload = e => { let img = document.createElement('img'); img.src = e.target.result; img.className = 'preview-img'; imgPreview.appendChild(img); }
                reader.readAsDataURL(file);
            });
        });

        const vidInput = document.getElementById('vid-input');
        const vidPreview = document.getElementById('vid-preview');
        vidInput.addEventListener('change', function() {
            if (this.files[0]) {
                let reader = new FileReader();
                reader.onload = e => { vidPreview.src = e.target.result; vidPreview.style.display = 'block'; }
                reader.readAsDataURL(this.files[0]);
            } else { vidPreview.style.display = 'none'; }
        });
    </script>
</body>
  </html>
