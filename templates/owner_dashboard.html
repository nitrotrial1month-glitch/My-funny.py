<!DOCTYPE html>
<html>
<head><title>Owner Dashboard</title></head>
<body>
    <h1>Owner Panel - Bot Settings</h1>
    <form method="POST">
        <label>Bot Prefix:</label>
        <input type="text" name="prefix" value="{{ config.prefix }}" required>
        <br>
        <label>Bot Status:</label>
        <input type="text" name="status" value="{{ config.status }}" required>
        <br>
        <button type="submit">Save Changes</button>
    </form>
    <a href="/">Back Home</a>
</body>
</html>
